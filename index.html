<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HogarSync - Control del Hogar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- UTILIDADES DE FECHA LOCAL (Evita desfases por zonas horarias UTC) ---
        const getTodayStr = () => {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const formatLocalDate = (dateObj) => {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const parseLocalDate = (dateStr) => {
            if (!dateStr) return new Date();
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        // --- CONSTANTES DE LA APLICACIÓN ---
        const ROOMS = [
            'Patio',
            'Salón',
            'Cocina',
            'Baño planta 1',
            'Habitación nenes',
            'Habitación matrimonio',
            'Baño planta 2',
            'Solárium',
            'Trastero',
            'Despacho',
            'Sala de juegos'
        ];

        const ANNUAL_CATEGORIES = [
            'Impuestos y Tasas',
            'Seguros',
            'Vehículos e ITV',
            'Servicios y Suministros',
            'Documentación',
            'Otro'
        ];

        const MONTHS_LIST = [
            'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
            'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
        ];

        const DAYS_OF_WEEK = [
            { id: 'lun', name: 'Lunes', short: 'Lun', dayNum: 1 },
            { id: 'mar', name: 'Martes', short: 'Mar', dayNum: 2 },
            { id: 'mie', name: 'Miércoles', short: 'Mié', dayNum: 3 },
            { id: 'jue', name: 'Jueves', short: 'Jue', dayNum: 4 },
            { id: 'vie', name: 'Viernes', short: 'Vie', dayNum: 5 },
            { id: 'sab', name: 'Sábado', short: 'Sáb', dayNum: 6 },
            { id: 'dom', name: 'Domingo', short: 'Dom', dayNum: 0 },
        ];

        const INITIAL_ANNUAL = [
            {
                id: 'a1',
                title: 'Declaración de la Renta (IRPF)',
                category: 'Impuestos y Tasas',
                month: 'Mayo',
                dueDate: '2026-06-30',
                cost: 0,
                status: 'Pendiente',
                notes: 'Revisar borrador en la web de la Agencia Tributaria y deducciones autonómicas.',
                createdAt: getTodayStr()
            },
            {
                id: 'a2',
                title: 'Impuesto sobre Bienes Inmuebles (IBI)',
                category: 'Impuestos y Tasas',
                month: 'Octubre',
                dueDate: '2026-10-20',
                cost: 380,
                status: 'Pendiente',
                notes: 'Cobro domiciliado en la cuenta habitual del banco.',
                createdAt: getTodayStr()
            },
            {
                id: 'a3',
                title: 'Impuesto de Circulación (IVTM)',
                category: 'Vehículos e ITV',
                month: 'Mayo',
                dueDate: '2026-05-15',
                cost: 85,
                status: 'Pendiente',
                notes: 'Impuesto municipal del vehículo principal.',
                createdAt: getTodayStr()
            },
            {
                id: 'a4',
                title: 'Seguro del Hogar (Renovación)',
                category: 'Seguros',
                month: 'Noviembre',
                dueDate: '2026-11-15',
                cost: 260,
                status: 'Pendiente',
                notes: 'Revisar coberturas y comparar precios un mes antes.',
                createdAt: getTodayStr()
            },
            {
                id: 'a5',
                title: 'Inspección Técnica de Vehículos (ITV)',
                category: 'Vehículos e ITV',
                month: 'Julio',
                dueDate: '2026-07-10',
                cost: 48,
                status: 'Pendiente',
                notes: 'Pedir cita previa online semanas antes.',
                createdAt: getTodayStr()
            },
            {
                id: 'a6',
                title: 'Revisión anual caldera de gas',
                category: 'Servicios y Suministros',
                month: 'Septiembre',
                dueDate: '2026-09-30',
                cost: 95,
                status: 'Completado',
                notes: 'Mantenimiento preventivo obligatorio de la instalación.',
                createdAt: getTodayStr()
            }
        ];

        const INITIAL_ROUTINES = [
            { id: 'r1', title: 'Barrer y fregar el suelo', room: 'Salón', period: 'Mañana', days: ['lun', 'mie', 'vie'] },
            { id: 'r2', title: 'Limpieza profunda de encimera y vitro', room: 'Cocina', period: 'Noche', days: ['lun', 'mar', 'mie', 'jue', 'vie', 'sab', 'dom'] },
            { id: 'r3', title: 'Regar plantas y repasar muebles exteriores', room: 'Patio', period: 'Tarde', days: ['mar', 'jue', 'sab'] },
            { id: 'r4', title: 'Limpiar mamparas y sanitarios', room: 'Baño planta 1', period: 'Mañana', days: ['lun', 'jue'] },
            { id: 'r5', title: 'Recoger juguetes y airear estancia', room: 'Habitación nenes', period: 'Tarde', days: ['lun', 'mar', 'mie', 'jue', 'vie'] },
            { id: 'r6', title: 'Limpieza y ventilación de terraza', room: 'Solárium', period: 'Mañana', days: ['sab'] },
            { id: 'r7', title: 'Pasar aspirador y desempolvar mesa', room: 'Despacho', period: 'Tarde', days: ['mie'] }
        ];

        const INITIAL_BACKLOG = [
            {
                id: 'b1',
                title: 'Limpiar filtros de aire acondicionado y bomba de calor',
                room: 'Solárium',
                priority: 'Alta',
                status: 'Pendiente',
                description: 'Desmontar los filtros frontales, lavar con agua templada y jabón neutro. Dejar secar bien.',
                createdAt: getTodayStr()
            },
            {
                id: 'b2',
                title: 'Ajustar bisagra suelta del mueble bajo fregadero',
                room: 'Cocina',
                priority: 'Media',
                status: 'Pendiente',
                description: 'Requiere destornillador de estrella y apretar los tornillos de retención.',
                createdAt: getTodayStr()
            },
            {
                id: 'b3',
                title: 'Descalcificar cafetera y hervidor',
                room: 'Cocina',
                priority: 'Media',
                status: 'Pendiente',
                description: 'Ejecutar ciclo de limpieza con solución antical específica.',
                createdAt: getTodayStr()
            },
            {
                id: 'b4',
                title: 'Organizar cajas y etiquetar estanterías',
                room: 'Trastero',
                priority: 'Baja',
                status: 'Completado',
                description: 'Clasificar herramientas y guardar en cajas de plástico transparentes.',
                createdAt: getTodayStr()
            }
        ];

        // --- ENDPOINT PUBLICO DE SINCRONIZACIÓN EN NUBE (REST API) ---
        const getCloudEndpoint = (code) => {
            const cleanCode = code.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
            return `https://hogarsync-default-rtdb.europe-west1.firebasedatabase.app/families/${cleanCode}.json`;
        };

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            // Navegación
            const [activeTab, setActiveTab] = useState('routines');
            const [selectedDate, setSelectedDate] = useState(getTodayStr());

            // Estado de Sincronización
            const [familyCode, setFamilyCode] = useState(() => localStorage.getItem('hogar_family_code') || '');
            const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
            const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);
            const [syncStatus, setSyncStatus] = useState('idle'); // idle, syncing, connected, error
            const [toastMessage, setToastMessage] = useState(null);

            // Modales de formulación
            const [isRoutineModalOpen, setIsRoutineModalOpen] = useState(false);
            const [editingRoutine, setEditingRoutine] = useState(null);
            const [isManageRoutinesOpen, setIsManageRoutinesOpen] = useState(false);

            const [isBacklogModalOpen, setIsBacklogModalOpen] = useState(false);
            const [editingBacklog, setEditingBacklog] = useState(null);

            const [isAnnualModalOpen, setIsAnnualModalOpen] = useState(false);
            const [editingAnnual, setEditingAnnual] = useState(null);

            // Diálogo de confirmación de borrado
            const [deleteConfirm, setDeleteConfirm] = useState(null); // { type, id, title }

            // Datos Principales
            const [routines, setRoutines] = useState(() => {
                const saved = localStorage.getItem('hogar_routines');
                return saved ? JSON.parse(saved) : INITIAL_ROUTINES;
            });

            const [completedLogs, setCompletedLogs] = useState(() => {
                const saved = localStorage.getItem('hogar_completed_logs');
                return saved ? JSON.parse(saved) : {};
            });

            const [backlogItems, setBacklogItems] = useState(() => {
                const saved = localStorage.getItem('hogar_backlog');
                if (!saved) return INITIAL_BACKLOG;
                const parsed = JSON.parse(saved);
                return parsed.map(item => item.status === 'En curso' ? { ...item, status: 'Pendiente' } : item);
            });

            const [annualItems, setAnnualItems] = useState(() => {
                const saved = localStorage.getItem('hogar_annual');
                return saved ? JSON.parse(saved) : INITIAL_ANNUAL;
            });

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            // --- MOTOR DE SINCRONIZACIÓN EN TIEMPO REAL VÍA REST ---
            const pushDataToCloud = useCallback(async (customPayload = null) => {
                if (!familyCode.trim()) return;
                setSyncStatus('syncing');
                try {
                    const payload = customPayload || {
                        routines,
                        completedLogs,
                        backlogItems,
                        annualItems,
                        lastUpdated: Date.now()
                    };
                    const url = getCloudEndpoint(familyCode);
                    const res = await fetch(url, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        setSyncStatus('connected');
                    } else {
                        setSyncStatus('error');
                    }
                } catch (err) {
                    console.error("Cloud push failed:", err);
                    setSyncStatus('error');
                }
            }, [familyCode, routines, completedLogs, backlogItems, annualItems]);

            const pullDataFromCloud = useCallback(async () => {
                if (!familyCode.trim()) return;
                try {
                    const url = getCloudEndpoint(familyCode);
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && typeof data === 'object') {
                            if (data.routines) setRoutines(data.routines);
                            if (data.completedLogs) setCompletedLogs(data.completedLogs);
                            if (data.backlogItems) setBacklogItems(data.backlogItems);
                            if (data.annualItems) setAnnualItems(data.annualItems);
                            setSyncStatus('connected');
                        }
                    }
                } catch (err) {
                    console.error("Cloud pull failed:", err);
                    setSyncStatus('error');
                }
            }, [familyCode]);

            // Guardar localmente y sincronizar cambios
            useEffect(() => {
                localStorage.setItem('hogar_routines', JSON.stringify(routines));
            }, [routines]);

            useEffect(() => {
                localStorage.setItem('hogar_completed_logs', JSON.stringify(completedLogs));
            }, [completedLogs]);

            useEffect(() => {
                localStorage.setItem('hogar_backlog', JSON.stringify(backlogItems));
            }, [backlogItems]);

            useEffect(() => {
                localStorage.setItem('hogar_annual', JSON.stringify(annualItems));
            }, [annualItems]);

            // Polling continuo cada 4 segundos cuando hay código de familia
            useEffect(() => {
                if (!familyCode.trim()) {
                    setSyncStatus('idle');
                    return;
                }
                pullDataFromCloud();
                const interval = setInterval(() => {
                    pullDataFromCloud();
                }, 4000);
                return () => clearInterval(interval);
            }, [familyCode, pullDataFromCloud]);

            const handleSaveFamilyCode = (code) => {
                const clean = code.trim().toLowerCase();
                setFamilyCode(clean);
                localStorage.setItem('hogar_family_code', clean);
                if (clean) {
                    showToast(`Conectado al Código de Familia: ${clean}`);
                }
            };

            const exportBackup = () => {
                const data = { routines, completedLogs, backlogItems, annualItems, exportDate: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `HogarSync_Copia_${getTodayStr()}.json`;
                a.click();
                showToast("Copia de seguridad descargada.");
            };

            const importBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.routines) setRoutines(imported.routines);
                        if (imported.completedLogs) setCompletedLogs(imported.completedLogs);
                        if (imported.backlogItems) setBacklogItems(imported.backlogItems);
                        if (imported.annualItems) setAnnualItems(imported.annualItems);
                        showToast("¡Copia de seguridad restaurada correctamente!");
                        setIsBackupModalOpen(false);
                        if (familyCode.trim()) {
                            pushDataToCloud({
                                routines: imported.routines || routines,
                                completedLogs: imported.completedLogs || completedLogs,
                                backlogItems: imported.backlogItems || backlogItems,
                                annualItems: imported.annualItems || annualItems,
                                lastUpdated: Date.now()
                            });
                        }
                    } catch (err) {
                        showToast("Error: El archivo no es un JSON válido.");
                    }
                };
                reader.readAsText(file);
            };

            // Filtros Backlog / Mantenimiento
            const [filterRoom, setFilterRoom] = useState('Todas');
            const [filterPriority, setFilterPriority] = useState('Todas');
            const [filterStatus, setFilterStatus] = useState('Todas');
            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('priority_desc');

            // Filtros Trámites Anuales
            const [annualCategory, setAnnualCategory] = useState('Todas');
            const [annualMonth, setAnnualMonth] = useState('Todos');
            const [annualStatus, setAnnualStatus] = useState('Todas');
            const [annualSearch, setAnnualSearch] = useState('');
            const [annualSort, setAnnualSort] = useState('month_asc');

            // Cálculos de fecha local
            const currentDateObj = useMemo(() => parseLocalDate(selectedDate), [selectedDate]);
            const currentDayOfWeekNum = currentDateObj.getDay();

            const currentDayMeta = useMemo(() => {
                return DAYS_OF_WEEK.find(d => d.dayNum === currentDayOfWeekNum) || DAYS_OF_WEEK[0];
            }, [currentDayOfWeekNum]);

            const weekDaysList = useMemo(() => {
                const curr = parseLocalDate(selectedDate);
                const day = curr.getDay();
                const diffToMon = curr.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(curr.setDate(diffToMon));

                return DAYS_OF_WEEK.map((d, index) => {
                    const tempDate = new Date(monday);
                    tempDate.setDate(monday.getDate() + index);
                    const dateStr = formatLocalDate(tempDate);
                    return {
                        ...d,
                        dateStr,
                        dayNumber: tempDate.getDate(),
                        isToday: dateStr === getTodayStr(),
                        isSelected: dateStr === selectedDate
                    };
                });
            }, [selectedDate]);

            const changeDateByDays = (delta) => {
                const date = parseLocalDate(selectedDate);
                date.setDate(date.getDate() + delta);
                setSelectedDate(formatLocalDate(date));
            };

            const dailyRoutines = useMemo(() => {
                return routines.filter(r => r.days.includes(currentDayMeta.id));
            }, [routines, currentDayMeta]);

            const toggleRoutineCompletion = (routineId) => {
                const key = `${selectedDate}_${routineId}`;
                const nextVal = !completedLogs[key];
                const updatedLogs = { ...completedLogs, [key]: nextVal };
                setCompletedLogs(updatedLogs);
                if (familyCode.trim()) {
                    pushDataToCloud({ routines, completedLogs: updatedLogs, backlogItems, annualItems, lastUpdated: Date.now() });
                }
            };

            // Acciones Rutinas
            const handleSaveRoutine = (routineData) => {
                let updated;
                if (editingRoutine) {
                    updated = routines.map(r => r.id === editingRoutine.id ? { ...r, ...routineData } : r);
                } else {
                    updated = [...routines, { ...routineData, id: 'r_' + Date.now() }];
                }
                setRoutines(updated);
                setIsRoutineModalOpen(false);
                setEditingRoutine(null);
                if (familyCode.trim()) pushDataToCloud({ routines: updated, completedLogs, backlogItems, annualItems, lastUpdated: Date.now() });
            };

            const duplicateRoutine = (routine) => {
                const updated = [...routines, { ...routine, id: 'r_' + Date.now(), title: `${routine.title} (Copia)` }];
                setRoutines(updated);
                if (familyCode.trim()) pushDataToCloud({ routines: updated, completedLogs, backlogItems, annualItems, lastUpdated: Date.now() });
            };

            // Acciones Backlog
            const handleSaveBacklog = (backlogData) => {
                let updated;
                if (editingBacklog) {
                    updated = backlogItems.map(b => b.id === editingBacklog.id ? { ...b, ...backlogData } : b);
                } else {
                    updated = [{ ...backlogData, id: 'b_' + Date.now(), createdAt: getTodayStr() }, ...backlogItems];
                }
                setBacklogItems(updated);
                setIsBacklogModalOpen(false);
                setEditingBacklog(null);
                if (familyCode.trim()) pushDataToCloud({ routines, completedLogs, backlogItems: updated, annualItems, lastUpdated: Date.now() });
            };

            const duplicateBacklog = (item) => {
                const updated = [{ ...item, id: 'b_' + Date.now(), title: `${item.title} (Copia)`, createdAt: getTodayStr() }, ...backlogItems];
                setBacklogItems(updated);
                if (familyCode.trim()) pushDataToCloud({ routines, completedLogs, backlogItems: updated, annualItems, lastUpdated: Date.now() });
            };

            const updateBacklogStatus = (id, newStatus) => {
                const updated = backlogItems.map(item => item.id === id ? { ...item, status: newStatus } : item);
                setBacklogItems(updated);
                if (familyCode.trim()) pushDataToCloud({ routines, completedLogs, backlogItems: updated, annualItems, lastUpdated: Date.now() });
            };

            // Acciones Trámites Anuales
            const handleSaveAnnual = (annualData) => {
                let updated;
                if (editingAnnual) {
                    updated = annualItems.map(a => a.id === editingAnnual.id ? { ...a, ...annualData } : a);
                } else {
                    updated = [{ ...annualData, id: 'a_' + Date.now(), createdAt: getTodayStr() }, ...annualItems];
                }
                setAnnualItems(updated);
                setIsAnnualModalOpen(false);
                setEditingAnnual(null);
                if (familyCode.trim()) pushDataToCloud({ routines, completedLogs, backlogItems, annualItems: updated, lastUpdated: Date.now() });
            };

            const duplicateAnnual = (item) => {
                const updated = [{ ...item, id: 'a_' + Date.now(), title: `${item.title} (Copia)`, createdAt: getTodayStr() }, ...annualItems];
                setAnnualItems(updated);
                if (familyCode.trim()) pushDataToCloud({ routines, completedLogs, backlogItems, annualItems: updated, lastUpdated: Date.now() });
            };

            const updateAnnualStatus = (id, newStatus) => {
                const updated = annualItems.map(item => item.id === id ? { ...item, status: newStatus } : item);
                setAnnualItems(updated);
                if (familyCode.trim()) pushDataToCloud({ routines, completedLogs, backlogItems, annualItems: updated, lastUpdated: Date.now() });
            };

            // Eliminar elemento tras confirmación
            const confirmDeleteAction = () => {
                if (!deleteConfirm) return;
                const { type, id } = deleteConfirm;
                let r = routines, b = backlogItems, a = annualItems;
                if (type === 'routine') {
                    r = routines.filter(item => item.id !== id);
                    setRoutines(r);
                } else if (type === 'backlog') {
                    b = backlogItems.filter(item => item.id !== id);
                    setBacklogItems(b);
                } else if (type === 'annual') {
                    a = annualItems.filter(item => item.id !== id);
                    setAnnualItems(a);
                }
                setDeleteConfirm(null);
                showToast("Elemento eliminado.");
                if (familyCode.trim()) pushDataToCloud({ routines: r, completedLogs, backlogItems: b, annualItems: a, lastUpdated: Date.now() });
            };

            // Listas ordenadas e integradas
            const filteredBacklog = useMemo(() => {
                const priorityWeight = { 'Alta': 3, 'Media': 2, 'Baja': 1 };
                const statusWeight = { 'Pendiente': 2, 'Completado': 1 };

                let items = backlogItems.filter(item => {
                    const matchRoom = filterRoom === 'Todas' || item.room === filterRoom;
                    const matchPriority = filterPriority === 'Todas' || item.priority === filterPriority;
                    const matchStatus = filterStatus === 'Todas' || item.status === filterStatus;
                    const matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                        (item.description && item.description.toLowerCase().includes(searchQuery.toLowerCase()));
                    return matchRoom && matchPriority && matchStatus && matchSearch;
                });

                return items.sort((a, b) => {
                    switch (sortBy) {
                        case 'priority_desc':
                            return priorityWeight[b.priority] - priorityWeight[a.priority];
                        case 'room_asc':
                            return a.room.localeCompare(b.room);
                        case 'created_desc':
                            return new Date(b.createdAt) - new Date(a.createdAt);
                        case 'title_asc':
                            return a.title.localeCompare(b.title);
                        case 'status_pending':
                            return statusWeight[b.status] - statusWeight[a.status];
                        default:
                            return 0;
                    }
                });
            }, [backlogItems, filterRoom, filterPriority, filterStatus, searchQuery, sortBy]);

            const filteredAnnual = useMemo(() => {
                let items = annualItems.filter(item => {
                    const matchCategory = annualCategory === 'Todas' || item.category === annualCategory;
                    const matchMonth = annualMonth === 'Todos' || item.month === annualMonth;
                    const matchStatus = annualStatus === 'Todas' || item.status === annualStatus;
                    const matchSearch = item.title.toLowerCase().includes(annualSearch.toLowerCase()) ||
                                        (item.notes && item.notes.toLowerCase().includes(annualSearch.toLowerCase()));
                    return matchCategory && matchMonth && matchStatus && matchSearch;
                });

                return items.sort((a, b) => {
                    switch (annualSort) {
                        case 'month_asc':
                            return MONTHS_LIST.indexOf(a.month) - MONTHS_LIST.indexOf(b.month);
                        case 'cost_desc':
                            return Number(b.cost || 0) - Number(a.cost || 0);
                        case 'cost_asc':
                            return Number(a.cost || 0) - Number(b.cost || 0);
                        case 'title_asc':
                            return a.title.localeCompare(b.title);
                        case 'status_pending':
                            return (a.status === 'Pendiente' ? -1 : 1) - (b.status === 'Pendiente' ? -1 : 1);
                        default:
                            return 0;
                    }
                });
            }, [annualItems, annualCategory, annualMonth, annualStatus, annualSearch, annualSort]);

            const annualStats = useMemo(() => {

                                <label className="block text-xs font-semibold text-slate-700 mb-1">Categoría</label>
                                <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                    {ANNUAL_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Mes de pago / vencimiento</label>
                                <select value={month} onChange={(e) => setMonth(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                    {MONTHS_LIST.map(m => <option key={m} value={m}>{m}</option>)}
                                </select>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Coste estimado (€)</label>
                                <input
                                    type="number"
                                    min="0"
                                    value={cost}
                                    onChange={(e) => setCost(e.target.value)}
                                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brand-500"
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Estado</label>
                                <select value={status} onChange={(e) => setStatus(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Completado">Completado</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">Notas adicionales</label>
                            <textarea
                                rows="3"
                                value={notes}
                                onChange={(e) => setNotes(e.target.value)}
                                placeholder="Fechas límites, cuenta bancaria, enlace a la web..."
                                className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-brand-500"
                            ></textarea>
                        </div>
                        <div className="pt-2 flex justify-end space-x-2">
                            <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">Cancelar</button>
                            <button type="submit" className="px-4 py-2 bg-brand-500 text-white rounded-xl text-xs font-semibold shadow-md shadow-brand-500/20">Guardar</button>
                        </div>
                    </form>
                </div>
            );
        }

        // Renderizado inicial en DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
